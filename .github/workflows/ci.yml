name: AI Quality Engineering CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regression:
    name: Offline Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      RUN_GEMINI_TESTS: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run offline regression suite
        run: |
          python -m pytest --json-report --json-report-file=reports/offline-test-report.json -q

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-regression-report
          path: reports/offline-test-report.json
          if-no-files-found: warn
          retention-days: 14
